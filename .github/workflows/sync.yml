name: Sync Ungapped data

# Pulls everything the dashboard shows and commits the aggregated result.
# Runs hourly; the dashboard's "Opdater nu" button re-reads the committed file.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      sample:
        description: 'Antal kontakter i engagement-stikprøven'
        required: false
        default: '2000'
  # Kørslen henter data *og* udgiver siden, så en ændring i selve dashboardet
  # skal også udløse den. Ellers ville en rettelse i brugerfladen først være
  # online ved næste timeslag.
  push:
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'public/**'
      - 'config/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tailwind.config.js'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/sync.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ungapped-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync
        env:
          UNGAPPED_API_KEY: ${{ secrets.UG_API }}
          ENGAGEMENT_SAMPLE: ${{ github.event.inputs.sample || '2000' }}
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: node scripts/ungapped-sync.mjs --out public/data

      # The data file is generated, never edited by hand, so the fresh copy
      # always wins. Rebasing onto a run that finished after this one checked
      # out produced a conflict on exactly that file and failed the run; reset
      # to the current remote and lay the new file on top instead.
      - name: Commit the aggregated data
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp public/data/dashboard.json "$RUNNER_TEMP/dashboard.json"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p public/data
            cp "$RUNNER_TEMP/dashboard.json" public/data/dashboard.json
            git add public/data/dashboard.json
            if git diff --staged --quiet; then
              echo "data uændret"
              break
            fi
            git commit -m "Opdater data $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:main; then
              echo "data pushet"
              break
            fi
            echo "push afvist — nogen kom os i forkøbet, forsøg $attempt"
            sleep $((attempt * 5))
          done

      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # The private build carries its data, so it works offline and never
      # reaches a public URL. Downloaded from this run's artifacts.
      - name: Build the self-contained file
        run: |
          npm run build:single
          node scripts/make-singlefile.mjs dist-single/index.html public/data/dashboard.json DP-udsendelsesdashboard.html

      - name: Upload the self-contained file
        uses: actions/upload-artifact@v4
        with:
          name: DP-udsendelsesdashboard
          path: DP-udsendelsesdashboard.html
          retention-days: 30

      # enablement turns Pages on via the API using this workflow's own token,
      # so the site does not depend on anyone visiting the settings page. It
      # needs the pages: write permission granted above.
      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the site
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to Pages
        id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Where things ended up
        run: |
          if [ "${{ steps.pages.outcome }}" = "success" ]; then
            echo "## Dashboardet er ude" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Pages kunne ikke slås til automatisk" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Slå det til manuelt: Settings → Pages → Source: GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
            echo "Næste kørsel deployer så af sig selv." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Den private, selvstændige fil ligger under Artifacts på denne kørsel." >> "$GITHUB_STEP_SUMMARY"

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
