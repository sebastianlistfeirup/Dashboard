name: Sync Ungapped data

# Pulls everything the dashboard shows and commits the aggregated result.
# Runs hourly; the dashboard's "Opdater nu" button re-reads the committed file.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      sample:
        description: 'Antal kontakter i engagement-stikprøven'
        required: false
        default: '2000'
  push:
    paths:
      - 'scripts/ungapped-sync.mjs'
      - 'scripts/lib/**'
      - '.github/workflows/sync.yml'

permissions:
  contents: write

concurrency:
  group: ungapped-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync
        env:
          UNGAPPED_API_KEY: ${{ secrets.UG_API }}
          ENGAGEMENT_SAMPLE: ${{ github.event.inputs.sample || '2000' }}
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: node scripts/ungapped-sync.mjs --out public/data

      - name: Commit the aggregated data
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/dashboard.json
          git diff --staged --quiet && { echo "uændret"; exit 0; }
          git commit -m "Opdater data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push origin HEAD:main
