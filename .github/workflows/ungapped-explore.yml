name: Ungapped API discovery

# Maps the Ungapped API from a GitHub runner, which has the outbound network
# access the Claude Code session lacks. Read-only: the script issues GET only.
# Results land on the `ungapped-data` branch and as a build artifact.

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'scripts/ungapped-explore.mjs'
      - '.github/workflows/ungapped-explore.yml'

permissions:
  contents: write

concurrency:
  group: ungapped-explore
  cancel-in-progress: false

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check that the API key secret exists
        env:
          UNGAPPED_API_KEY: ${{ secrets.UG_API }}
        run: |
          if [ -z "$UNGAPPED_API_KEY" ]; then
            echo "::error::Repository secret UG_API is not set."
            echo "Add it under Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          echo "Secret present (${#UNGAPPED_API_KEY} characters)."

      - name: Run discovery
        env:
          UNGAPPED_API_KEY: ${{ secrets.UG_API }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cd "$RUNNER_TEMP/out"
          node "$GITHUB_WORKSPACE/scripts/ungapped-explore.mjs"

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ungapped-discovery
          path: ${{ runner.temp }}/out/ungapped-discovery
          if-no-files-found: warn

      - name: Publish results to the ungapped-data branch
        if: always()
        run: |
          set -euo pipefail
          [ -d "$RUNNER_TEMP/out/ungapped-discovery" ] || { echo "no output to publish"; exit 0; }
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan ungapped-data
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r "$RUNNER_TEMP/out/ungapped-discovery" .
          git add -A
          git commit -m "Ungapped API discovery $(date -u +%FT%TZ)"
          git push -f origin ungapped-data
