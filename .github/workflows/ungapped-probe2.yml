name: Ungapped API probe 2

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ungapped-probe2.mjs'
      - '.github/workflows/ungapped-probe2.yml'

permissions:
  contents: write

concurrency:
  group: ungapped-probe2

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe
        env:
          UNGAPPED_API_KEY: ${{ secrets.UG_API }}
        run: |
          mkdir -p "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/out"
          node "$GITHUB_WORKSPACE/scripts/ungapped-probe2.mjs"
      - name: Commit
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p docs/api-map
          cp "$RUNNER_TEMP/out/ungapped-probe2/probe2.json" docs/api-map/probe2.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api-map/probe2.json
          git diff --staged --quiet && { echo "no changes"; exit 0; }
          git commit -m "Update Ungapped API probe 2"
          git pull --rebase origin main
          git push origin HEAD:main
