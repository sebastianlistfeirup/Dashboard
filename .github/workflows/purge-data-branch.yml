name: Purge discovery data

# The repository is public, so raw API dumps must not live in it. Deletes the
# ungapped-data branch and every run artifact. Both deletions are unconditional:
# a "not found" is the desired end state, not a failure.

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/purge-data-branch.yml']

permissions:
  contents: write
  actions: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the ungapped-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/ungapped-data" \
            && echo "deleted branch ungapped-data" \
            || echo "branch ungapped-data already absent"
          echo "--- remaining branches ---"
          gh api "repos/${{ github.repository }}/branches" --jq '.[].name'

      - name: Delete every workflow artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts" --jq '.artifacts[].id' || true)
          if [ -z "$ids" ]; then echo "no artifacts present"; else
            for id in $ids; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && echo "deleted artifact $id"
            done
          fi
          echo "--- remaining artifacts ---"
          gh api "repos/${{ github.repository }}/actions/artifacts" --jq '.total_count'
